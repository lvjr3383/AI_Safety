<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="920" height="420" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Figure 2 — Command-number ordering (not a timeline)</text>
  <text x="460" y="54" text-anchor="middle" font-size="13" fill="#b42318" font-weight="bold">command-number order — NOT wall-clock time and NOT verified execution order (time_utc is null throughout)</text>

  <!-- Collection A strip -->
  <text x="40" y="104" font-size="14" font-weight="bold" fill="#243b53">g23619cmd.bin (18)</text>
  <line x1="40" y1="150" x2="880" y2="150" stroke="#9fb3c8" stroke-width="2"/>
  <!-- 18 ticks, highlight 1 & 5 as writers, 2-4 readers -->
  <g font-size="10" fill="#486581" text-anchor="middle">
    <!-- positions -->
    <g>
      <circle cx="70" cy="150" r="9" fill="#102a43"/><text x="70" y="178" fill="#102a43" font-weight="bold">1</text><text x="70" y="128" fill="#102a43">W</text>
      <circle cx="115" cy="150" r="9" fill="#237a3a"/><text x="115" y="178" fill="#237a3a" font-weight="bold">2</text><text x="115" y="128" fill="#237a3a">R</text>
      <circle cx="160" cy="150" r="9" fill="#237a3a"/><text x="160" y="178" fill="#237a3a" font-weight="bold">3</text><text x="160" y="128" fill="#237a3a">R</text>
      <circle cx="205" cy="150" r="9" fill="#237a3a"/><text x="205" y="178" fill="#237a3a" font-weight="bold">4</text><text x="205" y="128" fill="#237a3a">R</text>
      <circle cx="250" cy="150" r="9" fill="#102a43"/><text x="250" y="178" fill="#102a43" font-weight="bold">5</text><text x="250" y="128" fill="#102a43">W</text>
      <circle cx="295" cy="150" r="7" fill="#bcccdc"/><text x="295" y="178">6</text>
      <circle cx="340" cy="150" r="7" fill="#bcccdc"/><text x="340" y="178">7</text>
      <circle cx="385" cy="150" r="7" fill="#bcccdc"/><text x="385" y="178">7*</text>
      <circle cx="430" cy="150" r="7" fill="#bcccdc"/><text x="430" y="178">8</text>
      <circle cx="475" cy="150" r="7" fill="#bcccdc"/><text x="475" y="178">9</text>
      <circle cx="520" cy="150" r="7" fill="#bcccdc"/><text x="520" y="178">10</text>
      <circle cx="565" cy="150" r="7" fill="#bcccdc"/><text x="565" y="178">11</text>
      <circle cx="610" cy="150" r="7" fill="#bcccdc"/><text x="610" y="178">12</text>
      <circle cx="655" cy="150" r="7" fill="#bcccdc"/><text x="655" y="178">13</text>
      <circle cx="700" cy="150" r="7" fill="#bcccdc"/><text x="700" y="178">14</text>
      <circle cx="745" cy="150" r="7" fill="#bcccdc"/><text x="745" y="178">15</text>
      <circle cx="790" cy="150" r="7" fill="#bcccdc"/><text x="790" y="178">16</text>
      <circle cx="835" cy="150" r="7" fill="#bcccdc"/><text x="835" y="178">17</text>
    </g>
  </g>
  <text x="40" y="208" font-size="11" fill="#829ab1">W = writes /tmp/g236_tokens.json · R = reads it · 7* = second record tagged command-000007</text>

  <!-- Collection B strip -->
  <text x="40" y="270" font-size="14" font-weight="bold" fill="#243b53">g23619scmd.bin (10)</text>
  <line x1="40" y1="312" x2="560" y2="312" stroke="#9fb3c8" stroke-width="2"/>
  <g font-size="10" fill="#486581" text-anchor="middle">
    <circle cx="70" cy="312" r="7" fill="#bcccdc"/><text x="70" y="340">1</text>
    <circle cx="125" cy="312" r="7" fill="#bcccdc"/><text x="125" y="340">2</text>
    <circle cx="180" cy="312" r="7" fill="#bcccdc"/><text x="180" y="340">3</text>
    <circle cx="235" cy="312" r="7" fill="#bcccdc"/><text x="235" y="340">4</text>
    <circle cx="290" cy="312" r="7" fill="#bcccdc"/><text x="290" y="340">5</text>
    <circle cx="345" cy="312" r="7" fill="#bcccdc"/><text x="345" y="340">6</text>
    <circle cx="400" cy="312" r="7" fill="#bcccdc"/><text x="400" y="340">7</text>
    <circle cx="455" cy="312" r="7" fill="#bcccdc"/><text x="455" y="340">8</text>
    <circle cx="510" cy="312" r="7" fill="#bcccdc"/><text x="510" y="340">9</text>
    <circle cx="555" cy="312" r="7" fill="#bcccdc"/><text x="555" y="340">10</text>
  </g>

  <text x="40" y="392" font-size="11" fill="#829ab1">Reverse-number dependency candidates (writer cmd 5 → readers cmd 2/3/4) are visible here: the writer sits to the right of its</text>
  <text x="40" y="408" font-size="11" fill="#829ab1">candidate readers, so numbering cannot be read as execution order. Spacing is uniform, not temporal.</text>
</svg>
